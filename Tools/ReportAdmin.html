<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Report Config Admin</title>
  <style>
    :root{--ink:#183c39;--brand:#1f8178;--soft:#e7f4f1;--line:#b9dfd9;--bg:#f5fbfa;--danger:#b64242}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Noto Sans Thai",sans-serif}.shell{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}h1{font-size:22px;margin:0 0 4px}.hint{font-size:13px;color:#54716d;margin:0 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 5px 18px #1f817812}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}.field,label{display:block;font-size:13px;font-weight:700}.field,select,button{font:inherit}input,select{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink)}button{border:0;border-radius:11px;padding:11px 13px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}button.soft{background:var(--soft);color:var(--ink)}button.danger{background:#fff1f1;color:var(--danger)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tabs button{background:var(--soft);color:var(--ink);font-size:13px}.tabs button.active{background:var(--brand);color:#fff}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.itemTitle{font-weight:700;line-height:1.35}.meta{font-size:12px;color:#54716d;margin:4px 0 9px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}.modal{position:fixed;inset:0;background:#163d3988;display:none;align-items:end;z-index:5}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:90dvh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.status{min-height:20px;font-size:13px;color:#54716d;margin-top:10px}.status.error{color:var(--danger)}@media(max-width:430px){.grid{grid-template-columns:1fr}.shell{padding-inline:12px}}
  </style>
</head>
<body>
<main class="shell">
  <h1>ตั้งค่ารายงาน</h1><p class="hint">รายการนี้เป็น config กลางของแต่ละ account</p>
  <section class="card"><label>Account<select id="account"><option>7-ELEVEN</option><option>CJ MORE</option><option>LAWSON</option><option>MINI BIG C</option><option>VILLA MARKET</option><option>LOTUS'S GO FRESH</option><option>JIFFY</option><option>TOPS DAILY</option></select></label><div class="actions" style="margin-top:10px"><button class="soft" id="update">อัปเดท</button><button class="soft" id="sync">Sync</button></div><div class="status" id="status">กำลังโหลด...</div></section>
  <section class="card"><div class="tabs"><button class="active" data-kind="sku">สินค้า</button><button data-kind="summary">หัวข้อสรุป</button><button data-kind="promotion">สื่อโปรโมชั่น</button></div><div class="row" style="margin-top:14px"><strong class="grow" id="listTitle">สินค้า</strong><button id="add">+ เพิ่ม</button></div><div id="list"></div></section>
  <button id="saveFab" style="position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));box-shadow:0 8px 22px #183c3966">SAVE</button>
</main>
<div class="modal" id="modal"><form class="sheet" id="form"><div class="row"><h2 class="grow" id="formTitle">เพิ่มรายการ</h2><button type="button" class="soft" id="close">ปิด</button></div><div class="grid"><label class="wide">ชื่อรายการ<input id="label" required maxlength="160"></label><label id="familyWrap">ประเภท<select id="family"><option value="SME">SME</option><option value="DEN">DEN</option></select></label><label id="categoryWrap">หมวดในฟอร์ม<select id="category" required><option value="" disabled selected>เลือกหมวดหมู่</option><option value="📍สินค้าโฟม SMOOTHE">📍สินค้าโฟม SMOOTHE</option><option value="📍สินค้าครีม SMOOTHE">📍สินค้าครีม SMOOTHE</option><option value="📍สินค้ายาสีฟัน DENTISTE">📍สินค้ายาสีฟัน DENTISTE</option><option value="📍สินค้าแปรงสีฟัน DENTISTE">📍สินค้าแปรงสีฟัน DENTISTE</option></select></label><label id="formSortWrap">ลำดับใน popup<input id="formSort" type="number" min="0" value="10"></label><label id="sortWrap">ลำดับในรายงาน<input id="sort" type="number" min="0" value="10"></label><label id="flagWrap">ค่าเริ่มต้น<select id="defaultFlag"><option value="">ว่าง</option><option value="focus">⭐</option><option value="skip">❌</option></select></label><label>สถานะ<select id="active"><option value="true">ใช้งาน</option><option value="false">ปิดใช้งาน</option></select></label></div><div class="actions" style="margin-top:16px"><button class="grow" type="submit">บันทึก</button><button type="button" class="danger" id="remove">ลบรายการ</button></div></form></div>
<script>
(() => {
  const API_URL = 'https://script.google.com/macros/s/AKfycbw91N5J4z1Jjn0rZz8qnn-ZFmP6bYJ2IZaKrOXrDaTj3aJoAvGJCVJBy982T_pXilNS/exec';
  const $ = id => document.getElementById(id); const STORE='PT_REPORT_ADMIN_DRAFT_V1'; const SKU_CATEGORIES=['📍สินค้าโฟม SMOOTHE','📍สินค้าครีม SMOOTHE','📍สินค้ายาสีฟัน DENTISTE','📍สินค้าแปรงสีฟัน DENTISTE']; let kind='sku', items=[], editing=null, syncing=false; let drafts=JSON.parse(localStorage.getItem(STORE)||'{}');
  const BUILTIN = {
    summary: [
      ['brush_advanced_b1g1','⛔สรุปแปรงแอดวานซ์ 1แถม1'], ['brush_pack3_b1g1','⛔สรุปแปรงแพ็ค3 1แถม1'],
      ['acne_scar_5g_b1g1','⛔สรุปแอคเน่สการ์5G 1แถม1'], ['acne_gel_5g_b1g1','⛔สรุปเจลแต้มสิว5G 1แถม1'],
      ['travel_brush_set_b1g1','⛔สรุปแปรงชุดเดินทาง 1แถม1'], ['floss_b1g1','⛔สรุปไหมขัดฟัน 1แถม1'], ['dentiste_max_45g_b1g1','⛔สรุปเดนทิสเต้ MAX 45G 1แถม1']
    ],
    promotion: [
      ['sme_spot_clear_foam_40ml','⭐SME สปอตเคลียร์โฟม40มล.'], ['sme_baby_face_gel_1_5oz','⭐SME เบบี้เฟชเจลล้างหน้า 1.5oz'],
      ['den_advanced_care_toothbrush','⭐DEN แปรงสีฟันแอดวานซ์แคร์'], ['sme_sun_zero_feel_sachet','⭐SME สมูทอี ซัน ซีโร่ ฟีล(ซอง)'],
      ['sme_acne_sun_5g_sachet','⭐ SME สมูทอีแอคเน่ซัน 5g.(ซอง )'], ['sme_white_cream_5g_sachet','⭐SME ไวท์ครีม 5G. (ซอง)'], ['sme_gold_cream_5g_sachet','⭐SME โกลครีม 5G. (ซอง)']
    ]
  };
  function status(text, error=false){const el=$('status');el.textContent=text;el.className='status'+(error?' error':'');}
  function jsonp(action, params={}){return new Promise((resolve,reject)=>{const cb='__rc_'+Date.now()+'_'+Math.random().toString(36).slice(2);const url=new URL(API_URL);url.searchParams.set('action',action);url.searchParams.set('callback',cb);Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,String(v)));const script=document.createElement('script');const timer=setTimeout(()=>done(new Error('หมดเวลารอ API')),30000);function done(err,val){clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(val)}window[cb]=v=>done(null,v);script.onerror=()=>done(new Error('เชื่อมต่อ API ไม่สำเร็จ'));script.src=url;document.head.appendChild(script);});}
  function account(){return $('account').value} function itemOrder(item){return kind==='sku'?(Number((item.data||{}).formSort)||item.sort):item.sort} function visible(){return items.filter(x=>x.kind===kind).sort((a,b)=>itemOrder(a)-itemOrder(b))} function labelForKind(){return kind==='sku'?'สินค้า':kind==='summary'?'หัวข้อสรุปท้ายงาน':'สื่อโปรโมชั่น'}
  function includeBuiltin(){for(const [type,rows] of Object.entries(BUILTIN))for(const [id,label] of rows)if(!items.some(x=>x.kind===type&&x.id===id))items.push({account:account(),kind:type,id,sort:rows.findIndex(x=>x[0]===id)+1,active:true,data:{label},builtin:true})}
  function persist(){drafts[account()]={items,updatedAt:Date.now()};localStorage.setItem(STORE,JSON.stringify(drafts));status('บันทึกในเครื่องแล้ว · รอ Sync')}
  async function load(force=false){const local=drafts[account()];if(local&&!force){items=local.items||[];includeBuiltin();render();status('ใช้ draft ในเครื่อง · รอ Sync');return}status('กำลังโหลด...');try{const r=await jsonp('getReportConfig',{account:account()});if(!r.ok)throw Error(r.message);items=r.items||[];includeBuiltin();render();status(`พร้อมใช้งาน ${items.length} รายการ config`)}catch(e){items=[];includeBuiltin();render();status(e.message,true)}}
  function render(){ $('listTitle').textContent=labelForKind();const list=$('list');list.innerHTML='';const rows=visible();if(!rows.length){list.innerHTML='<p class="hint">ยังไม่มีรายการ กด “เพิ่ม” เพื่อสร้างรายการแรก</p>';return}rows.forEach((item,index)=>{const d=item.data||{},el=document.createElement('div');const skuMeta=kind==='sku'?` · ${escape(d.family||'SME')} · ${escape(d.category||'ยังไม่กำหนดหมวด')} · ${d.defaultFlag==='focus'?'⭐':d.defaultFlag==='skip'?'❌':'ว่าง'}`:'';const disabledMeta=item.active?'':' · ปิดใช้งาน';const orderLabel=kind==='sku'?'ลำดับ popup':'ลำดับ';el.className='item';el.innerHTML=`<div class="itemTitle">${escape(d.label||item.id)}</div><div class="meta">${orderLabel} ${itemOrder(item)}${skuMeta}${disabledMeta}</div><div class="actions"><button class="soft" data-edit="${item.id}">แก้ไข</button><button class="soft" data-move="-1" data-id="${item.id}" ${index?'':'disabled'}>ขึ้น</button><button class="soft" data-move="1" data-id="${item.id}" ${index<rows.length-1?'':'disabled'}>ลง</button></div>`;list.appendChild(el)});}
  function escape(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function open(item){editing=item||null;const d=item?.data||{},isSku=kind==='sku',nextSort=Math.max(0,...items.map(x=>x.sort||0))+10,nextFormSort=Math.max(0,...items.filter(x=>x.kind==='sku').map(x=>Number((x.data||{}).formSort)||x.sort||0))+10;$('formTitle').textContent=item?'แก้ไขรายการ':'เพิ่ม '+labelForKind();$('label').value=d.label||'';$('family').value=d.family||'SME';$('category').value=SKU_CATEGORIES.includes(d.category)?d.category:'';$('category').disabled=!isSku;$('formSort').value=d.formSort??(item?.sort??nextFormSort);$('formSort').disabled=!isSku;$('defaultFlag').value=d.defaultFlag||'';$('sort').value=item?.sort??nextSort;$('sort').disabled=isSku;$('active').value=item?.active===false?'false':'true';$('remove').style.display=item?'block':'none';['familyWrap','categoryWrap','formSortWrap','flagWrap'].forEach(id=>$(id).style.display=isSku?'block':'none');$('sortWrap').style.display=isSku?'none':'block';$('modal').classList.add('open')}
  function close(){ $('modal').classList.remove('open') } function makeId(){return `${kind}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`}
  async function save(item){const index=items.findIndex(x=>x.kind===item.kind&&x.id===item.id);if(index<0)items.push(item);else items[index]=item;persist()}
  function sameConfig(remote, local){const key=x=>`${x.kind}:${x.id}`;const left=[...remote].sort((a,b)=>key(a).localeCompare(key(b)));const right=[...local].sort((a,b)=>key(a).localeCompare(key(b)));return left.length===right.length&&left.every((item,index)=>key(item)===key(right[index])&&item.sort===right[index].sort&&(item.active!==false)===(right[index].active!==false)&&JSON.stringify(item.data||{})===JSON.stringify(right[index].data||{}))}
  async function sync(){if(syncing)return;const local=drafts[account()];if(!local){status('ไม่มีรายการรอ Sync');return}syncing=true;try{status('กำลัง Sync...');await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveReportConfigBulk',items:local.items})});for(let attempt=0;attempt<5;attempt++){await new Promise(resolve=>setTimeout(resolve,1500));const result=await jsonp('getReportConfig',{account:account()});if(result.ok&&sameConfig(result.items||[],local.items)){delete drafts[account()];localStorage.setItem(STORE,JSON.stringify(drafts));items=result.items||[];includeBuiltin();render();status('Sync แล้ว');return}}throw Error('API ยังยืนยันข้อมูลไม่ได้')}catch(e){status('Sync ไม่สำเร็จ · ข้อมูลยังอยู่ในเครื่อง',true)}finally{syncing=false}}
  async function importSeed(){if(!confirm(`นำเข้ารายการเดิมทั้งหมดสำหรับ ${account()}?`))return;const frame=document.createElement('iframe');frame.hidden=true;frame.src='Report.html?configSeed=1';document.body.appendChild(frame);await new Promise((resolve,reject)=>{frame.onload=resolve;setTimeout(()=>reject(Error('อ่านรายการเดิมไม่สำเร็จ')),30000)});const seed=frame.contentWindow.__PT_REPORT_CONFIG_SEED;frame.remove();if(!seed)throw Error('ไม่พบรายการเดิม');const layouts=seed.copyLayouts[account()]||[];const positions=new Map();layouts.forEach((g,gi)=>g.ids.forEach((id,si)=>positions.set(id,{category:g.heading,sort:(gi+1)*1000+si})));const applies=s=>account()==='CJ MORE'?(s.accounts||[]).includes('CJ MORE'):!(s.accounts||[]).length||(s.accounts||[]).includes(account());const rows=[];seed.skuItems.filter(applies).forEach((s,i)=>{const p=positions.get(s.id);rows.push({kind:'sku',id:s.id,sort:p?.sort??i+1,active:true,data:{label:s.label,family:s.family,category:p?.category??(s.family==='SME'?'📍SMOOTH E':'📍DENTISTE'),defaultFlag:seed.defaultFlags[s.id]||''}})});seed.summaryTopics.forEach((x,i)=>rows.push({kind:'summary',id:x.id,sort:i+1,active:true,data:{label:x.label}}));seed.promotionMediaItems.forEach((x,i)=>rows.push({kind:'promotion',id:x.id,sort:i+1,active:true,data:{label:x.label}}));for(let i=0;i<rows.length;i++){status(`กำลังนำเข้า ${i+1}/${rows.length}...`);await save(rows[i])}await load();status(`นำเข้ารายการเดิม ${rows.length} รายการแล้ว`)}
  document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));render()});$('account').onchange=()=>load();$('add').onclick=()=>open(null);$('update').onclick=()=>drafts[account()]?status('มี draft รอ Sync กรุณา Sync ก่อน',true):load(true);$('sync').onclick=sync;$('saveFab').onclick=()=>{persist();sync()};$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('list').onclick=async e=>{const edit=e.target.dataset.edit,id=e.target.dataset.id;if(edit)return open(items.find(x=>x.id===edit&&x.kind===kind));if(!id)return;const row=visible(),index=row.findIndex(x=>x.id===id),other=row[index+Number(e.target.dataset.move)];if(!other)return;const a=items.find(x=>x.kind===kind&&x.id===id),aOrder=itemOrder(a),otherOrder=itemOrder(other);if(kind==='sku'){a.data.formSort=otherOrder;other.data.formSort=aOrder}else{a.sort=otherOrder;other.sort=aOrder}await Promise.all([save(a),save(other)]);render()};$('form').onsubmit=async e=>{e.preventDefault();const item=editing||{kind,id:makeId()};item.sort=item.sort??(Number($('sort').value)||0);item.active=$('active').value==='true';item.data={label:$('label').value.trim(),family:$('family').value,category:$('category').value.trim(),formSort:kind==='sku'?(Number($('formSort').value)||item.sort):undefined,defaultFlag:$('defaultFlag').value};await save(item);close();render()};$('remove').onclick=()=>{if(!editing||!confirm('ลบรายการนี้?'))return;items=items.filter(x=>!(x.kind===editing.kind&&x.id===editing.id));persist();close();render()};load();
})();
</script>
</body>
</html>
